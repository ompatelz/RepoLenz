name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy backend/repolens

      - name: Run tests
        run: pytest

      - name: Build distribution artifacts
        run: python -m build

      - name: Verify wheel installation and CLI smoke path
        run: >-
          python scripts/smoke_wheel_install.py
          --wheel dist/repolens-*.whl
          --fixture tests/fixtures/scanner/simple_python_project

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Verify packaged web assets match frontend build
        run: python3 scripts/sync_web_assets.py --check
